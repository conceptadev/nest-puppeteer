name: Preview release

# Dormant until the pkg.pr.new GitHub app is installed on conceptadev.
on:
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with: { install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm dlx pkg-pr-new@0.0.87 publish
