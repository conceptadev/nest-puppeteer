packages:
  - "."

allowBuilds:
  "@nestjs/core": false
  "@scarf/scarf": false
  "@swc/core": false
  esbuild: false
  puppeteer: false

minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.1.0'
  - '@changesets/cli@3.0.2'
  - '@changesets/git@4.0.1'
  - '@changesets/read@1.0.1'
  - tsdown@0.23.0

# A failed npm OIDC attestation must fail rather than silently publishing
# without provenance.
provenance: true
